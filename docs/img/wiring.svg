<rect x="20" y="60" width="330" height="76" rx="8" fill="#f4f7fb" stroke="#445" stroke-width="1.5"/>
<text x="30" y="82" font-size="14" font-weight="bold" fill="#111">GPS  LG290P</text>
<text x="30" y="100" font-size="12" fill="#335">UART1 460800</text>
<text x="30" y="118" font-size="12" fill="#222">RX GPIO4 · TX GPIO5</text>
