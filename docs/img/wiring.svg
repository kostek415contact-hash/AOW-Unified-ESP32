<text x="640" y="376" font-size="12" fill="#335">1 wire</text>
<text x="640" y="394" font-size="12" fill="#222">GPIO38</text>
<line x1="600" y1="374" x2="630" y2="374" stroke="#235" stroke-width="2"/>
<text x="490" y="452" text-anchor="middle" font-size="12" fill="#a00">Motor power (supply, fuse, hardware emergency stop) goes ONLY to the MD13S power terminals - never through the ESP32.</text>
