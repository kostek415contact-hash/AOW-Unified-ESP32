<text x="640" y="100" font-size="12" fill="#335">PWM + DIR</text>
<text x="640" y="118" font-size="12" fill="#222">PWM GPIO16 · DIR GPIO17</text>
<line x1="600" y1="98" x2="630" y2="98" stroke="#235" stroke-width="2"/>
<rect x="630" y="152" width="330" height="76" rx="8" fill="#f4f7fb" stroke="#445" stroke-width="1.5"/>
<text x="640" y="174" font-size="14" font-weight="bold" fill="#111">W5500 Ethernet (optional)</text>
<text x="640" y="192" font-size="12" fill="#335">SPI</text>
<text x="640" y="210" font-size="12" fill="#222">CS 10 · MOSI 11 · SCK 12 · MISO 13 · RST n/c</text>
<line x1="600" y1="190" x2="630" y2="190" stroke="#235" stroke-width="2"/>
<rect x="630" y="244" width="330" height="76" rx="8" fill="#f4f7fb" stroke="#445" stroke-width="1.5"/>
<text x="640" y="266" font-size="14" font-weight="bold" fill="#111">Steering button / work switch</text>
<text x="640" y="284" font-size="12" fill="#335">inputs</text>
<text x="640" y="302" font-size="12" fill="#222">GPIO15 / GPIO18 (to GND)</text>
<line x1="600" y1="282" x2="630" y2="282" stroke="#235" stroke-width="2"/>
<rect x="630" y="336" width="330" height="76" rx="8" fill="#f4f7fb" stroke="#445" stroke-width="1.5"/>
