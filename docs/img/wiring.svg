<text x="30" y="284" font-size="12" fill="#335">I²C</text>
<text x="30" y="302" font-size="12" fill="#222">SDA GPIO8 · SCL GPIO9 · A0 angle · A1 current</text>
<line x1="350" y1="282" x2="380" y2="282" stroke="#235" stroke-width="2"/>
<rect x="20" y="336" width="330" height="76" rx="8" fill="#f4f7fb" stroke="#445" stroke-width="1.5"/>
