<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="Helvetica,Arial,sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<text x="490" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">AOW-Unified-ESP32 - signal connections (ESP32-S3)</text>
